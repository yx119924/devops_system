# ==============================================================================
# XwOps 平台 —— Docker Compose 编排
#
# 快速启动：见仓库根目录 DEPLOY.md
#
# ★ 关于 image: 与 build: 并存
#   - `docker compose up -d`          直接用本地已加载的镜像，不触发构建（推荐）
#   - `docker compose up -d --build`  强制从 ./backend 与 ./web 源码重新构建
#   两条路都通：运维拿成品镜像可一键启动；开发者拿源码也可自行构建。
#
# ★ 关于业务代码如何进入容器（非常重要，见 DEPLOY.md 第 5 节）
#   web 镜像：前端已在镜像内编译完成（/usr/share/nginx/html）
#   django / celery 镜像：只装了 Python 依赖，业务代码不含在镜像里，
#                          靠下方 volumes 的 ./backend:/backend 挂载进入容器。
#   ⇒ 仓库里的 backend/ 源码目录是运行必需品，不能删。
# ==============================================================================

version: "3"

services:

  # ---------------------------------------------------------------------------
  # 前端 + 反向代理（nginx，前端已编译进镜像）
  # ---------------------------------------------------------------------------
  dvadmin3-web:
    image: xwops/web:1.0.0
    build:
      context: ./
      dockerfile: ./docker_env/web/Dockerfile
    container_name: dvadmin3-web
    ports:
      - "8080:8080"                    # 对外访问入口 http://<服务器IP>:8080
    environment:
      TZ: Asia/Shanghai
    volumes:
      # ★ 必须挂载：镜像内的 my.conf 里 proxy_pass 指向的是构建时的旧容器 IP，
      #   靠这里挂载仓库中的配置覆盖，才能与下方 networks 里的静态 IP 一致。
      - ./docker_env/nginx/my.conf:/etc/nginx/conf.d/my.conf
      - ./backend/media:/backend/media
    restart: always
    networks:
      network:
        ipv4_address: 172.31.0.11

  # ---------------------------------------------------------------------------
  # 后端（Django + DRF，ASGI 由 uvicorn 承载）
  # ---------------------------------------------------------------------------
  dvadmin3-django:
    image: xwops/django:1.0.0
    build:
      context: ./
      dockerfile: ./docker_env/django/Dockerfile
    container_name: dvadmin3-django
    working_dir: /backend
    depends_on:
      - dvadmin3-mysql
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_HOST: dvadmin3-mysql     # 容器间通信使用 compose 服务名
      TZ: Asia/Shanghai
      # 告警 Webhook 的 Bearer 密钥（也可改为写在 conf/env.py 里，两者取其一）
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    volumes:
      # ★ 业务代码挂载（镜像内不含代码，只有依赖）—— 改 Python 后重启容器即生效
      - ./backend:/backend
      - ./logs/log:/var/log
    ports:
      # ★ 只绑本机：Django 直连端口不对外暴露。
      #   历史版本写的是 "8000:8000"，会让后端（含免认证的 Swagger 文档）
      #   绕过 nginx 直接被公网访问。需要远程调试时用 SSH 隧道转 127.0.0.1:8000。
      - "127.0.0.1:8000:8000"
    restart: always
    networks:
      network:
        ipv4_address: 172.31.0.12

  # ---------------------------------------------------------------------------
  # 后端异步任务（Celery worker + beat）
  # ---------------------------------------------------------------------------
  dvadmin3-celery:
    image: xwops/celery:1.0.0
    build:
      context: ./
      dockerfile: ./docker_env/celery/Dockerfile
    container_name: dvadmin3-celery
    working_dir: /backend
    depends_on:
      - dvadmin3-mysql
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_HOST: dvadmin3-mysql
      TZ: Asia/Shanghai
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    restart: always
    networks:
      network:
        ipv4_address: 172.31.0.14

  # ---------------------------------------------------------------------------
  # MySQL 8.0（数据落盘在 docker_env/mysql/data，已 gitignore）
  # ---------------------------------------------------------------------------
  dvadmin3-mysql:
    image: mysql:8.0
    container_name: dvadmin3-mysql
    privileged: true
    restart: always
    ports:
      - "127.0.0.1:3306:3306"           # 只绑本机，避免数据库直接暴露公网
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: "django-vue3-admin"
      TZ: Asia/Shanghai
    command:
      --wait_timeout=31536000
      --interactive_timeout=31536000
      --max_connections=1000
      --default-authentication-plugin=mysql_native_password
    volumes:
      - "./docker_env/mysql/data:/var/lib/mysql"
      - "./docker_env/mysql/conf.d:/etc/mysql/conf.d"
      - "./docker_env/mysql/logs:/logs"
    networks:
      network:
        ipv4_address: 172.31.0.13

  # ---------------------------------------------------------------------------
  # Redis 6.2.6（缓存 / Celery broker / Channel Layer）
  # ---------------------------------------------------------------------------
  dvadmin3-redis:
    image: redis:6.2.6-alpine
    container_name: dvadmin3-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./docker_env/redis/data:/data
      - ./docker_env/redis/redis.conf:/etc/redis/redis.conf
    ports:
      - "127.0.0.1:6379:6379"           # 只绑本机
    sysctls:
      - net.core.somaxconn=1024
    command: /bin/sh -c "echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf && redis-server /etc/redis/redis.conf --appendonly yes --requirepass ${REDIS_PASSWORD}"
    privileged: true
    networks:
      network:
        ipv4_address: 172.31.0.15

networks:
  network:
    ipam:
      driver: default
      config:
        # ★ 容器内网网段。若与办公网/机房网段冲突，改这里，并同步改
        #   docker_env/nginx/my.conf 里 proxy_pass 的 IP（两者保持一致即可）。
        - subnet: '172.31.0.0/16'
