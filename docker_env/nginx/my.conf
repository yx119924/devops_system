server {
    listen       8080;
    server_name localhost;
    client_max_body_size 100M;
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        root /usr/share/nginx/html;
        index  index.html index.php index.htm;
        # 禁止缓存html与assets chunk,避免前端发版后用户命中旧 chunk 导致 rowHandle 等组件不渲染
        if ($request_uri ~* "^/$|^/index.html|^/index.htm|/assets/.*\\.(js|css)$") {
             add_header Cache-Control "no-store, no-cache, must-revalidate";
             add_header Pragma "no-cache";
             add_header Expires "0";
        }
    }

    # ===== 对外前缀 /devops（2026-11-03 新增，替代对外 /api）=====
    # 前端 baseURL 即 /devops（web/.env.production），代码里只写业务段；
    # 这里剥掉外层前缀后交给 django（django 侧路由已无 api/ 前缀）。
    # ★ 下面四项必须保留：Web SSH 与 SSE 都走这个 location，缺 Upgrade 头终端连不上。
    location /devops/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Nginx-Proxy true;
        set_real_ip_from 0.0.0.0/0;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        real_ip_header X-Forwarded-For;
        rewrite ^/devops/(.*)$ /$1 break;  #剥掉对外前缀
        proxy_pass http://172.31.0.12:8000/;
    }

    # 媒体文件（★ 必须单独配）：后端返回的 avatar/附件 url 形如 `/media/2026/11/x.png`，
    # 前端 getBaseURL() 会把它拼成 `/devops/media/2026/11/x.png`。
    # 如果没有这段，请求会落到 location /devops/ 被转发给 django —— 生产 DEBUG=False，
    # django 不 serve media，结果就是 404，全站头像与附件全部裂图。
    location /devops/media  {
        alias /backend/media;
        expires 7d;
        gzip  on;
        gzip_min_length 1k;
        gzip_comp_level 2;
        gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
        gzip_vary on;
    }

    # ===== 旧前缀 /api（过渡期保留）=====
    # 保留原因：Alertmanager webhook 打的是 /api/alert/webhook/receiver/（单层），
    # 外部巡检脚本也可能在用。django 已无 api/ 前缀，所以剥一层后依然命中。
    # 等 webhook 地址切到 /devops/ 并观察一周后再删这段。
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Nginx-Proxy true;
        set_real_ip_from 0.0.0.0/0;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        real_ip_header X-Forwarded-For;
        rewrite ^/api/(.*)$ /$1 break;  #重写
        proxy_pass http://172.31.0.12:8000/; # 设置代理服务器的协议和地址
    }
    location /media  {
	    alias /backend/media;
	    expires 7d;
	    gzip  on;
	    gzip_min_length 1k;
	    gzip_comp_level 2;
	    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
	    gzip_vary on;
	}
	location /api/media  {
	    alias /backend/media;
	    expires 7d;
	    gzip  on;
	    gzip_min_length 1k;
	    gzip_comp_level 2;
	    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
	    gzip_vary on;
	}
 }
