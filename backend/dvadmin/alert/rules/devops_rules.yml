groups:
- name: devops_alert_rules
  rules:
  - alert: PostgreSQLExporter不可用
    annotations:
      description: 实例 {{ $labels.instance }} 的 exporter 无法抓取
      summary: '{{ $labels.env }} PostgreSQL exporter 不可用'
    expr: up{job=~"backup_postgres"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: PostgreSQL备库未处于恢复模式
    annotations:
      description: 实例 {{ $labels.instance }} 可能已被提升为主库
      summary: '{{ $labels.env }} PostgreSQL 备库未处于恢复模式'
    expr: pg_standby_health_in_recovery{job=~"backup_postgres"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: PostgreSQL备库流复制异常
    annotations:
      description: 实例 {{ $labels.instance }} 的 WAL receiver 不是 streaming 状态
      summary: '{{ $labels.env }} PostgreSQL 备库流复制异常'
    expr: pg_standby_health_wal_receiver_streaming{job="backup_postgres"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: Kafka Broker 离线
    annotations:
      description: 服务器 {{ $labels.instance }} Kafka 不可用
      summary: Kafka Broker 已离线
    expr: up{job="kafka"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: 消费组积压
    annotations:
      description: 'kafka实例: {{ $labels.instance }}, Topic: {{ $labels.topic }}, 积压量:
        {{ $value }}'
      summary: Kafka 消费堆积
    expr: sum by (topic, group) (kafka_consumergroup_lag) > 2000
    for: 0s
    labels:
      severity: critical
  - alert: MinIO 服务离线
    annotations:
      description: ''
      summary: MinIO 服务不可用
    expr: up{job="minio_cluster"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: MinIO 磁盘空间不足
    annotations:
      description: '使用率: {{ $value }}%'
      summary: MinIO 存储容量不足
    expr: (round((100 * (minio_cluster_capacity_usable_total_bytes - minio_cluster_capacity_usable_free_bytes)
      / minio_cluster_capacity_usable_total_bytes) * 100) / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: PostgreSQL 服务宕机
    annotations:
      description: ''
      summary: '{{ $labels.env }} PostgreSQL 服务不可用'
    expr: up{job="postgres"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: PG 连接数过高
    annotations:
      description: 实例 {{ $labels.instance }} 当前连接数为 {{ $value }}，已超过阈值 95
      summary: '{{ $labels.env }} PG 连接数过高: {{ $value }}'
    expr: sum by (instance) (pg_stat_activity_count{state=~"active|idle|idle in transaction"})
      > 95
    for: 0s
    labels:
      severity: critical
  - alert: PostgreSQL主库慢查询过多
    annotations:
      description: 实例 {{ $labels.instance }} 当前慢查询数为 {{ $value }}
      summary: '{{ $labels.env }} PostgreSQL 主库慢查询过多'
    expr: pg_activity_slow_queries{job="postgres"} > 10
    for: 0s
    labels:
      severity: warning
  - alert: PostgreSQL主库存在阻塞查询
    annotations:
      description: 实例 {{ $labels.instance }} 当前阻塞查询数为 {{ $value }}
      summary: '{{ $labels.env }} PostgreSQL 主库存在阻塞查询'
    expr: pg_activity_blocking_queries{job="postgres"} > 5
    for: 0s
    labels:
      severity: warning
  - alert: PostgreSQL主备复制延迟过大
    annotations:
      description: 主库 {{ $labels.instance }} 到备库 {{ $labels.replica }} 延迟 {{ $value
        }} bytes
      summary: '{{ $labels.env }} PostgreSQL 主备复制延迟过大'
    expr: pg_replication_lag_lag_bytes{job="postgres"} > 1.048576e+06
    for: 0s
    labels:
      severity: warning
  - alert: Redis 服务宕机
    annotations:
      description: 服务器 {{ $labels.instance }} Redis 已断开连接
      summary: Redis 服务不可用
    expr: up{job="redis"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: Redis 内存使用率过高
    annotations:
      description: '内存使用率: {{ $value }}%'
      summary: Redis 内存使用率过高
    expr: (redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 6.8719476736e+10))
      * 100 > 90
    for: 0s
    labels:
      severity: critical
  - alert: Redis 连接数过高
    annotations:
      description: ''
      summary: Redis 连接数过高
    expr: redis_connected_clients > 5000
    for: 0s
    labels:
      severity: warning
  - alert: 122数仓服务器宕机
    annotations:
      description: 数仓服务器宕机，请及时处理
      summary: 数仓服务器 {{ $labels.instance }} 宕机
    expr: up{instance="192.0.2.155:9100",job="node_exporter"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: 磁盘使用率过高
    annotations:
      description: '分区 {{ $labels.mountpoint }} 使用率超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} 磁盘空间使用率过高
    expr: (round((100 - (node_filesystem_avail_bytes{job="node_exporter",mountpoint="/"}
      / node_filesystem_size_bytes{job="node_exporter",mountpoint="/"} * 100)) * 100)
      / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: 海豚调度任务运行超过1小时
    annotations:
      description: 超时任务名称：{{ $labels.process_name }}
      summary: 海豚调度任务运行超过1小时告警
    expr: sum by (instance_id, process_name, instance, job) (ds_process_running_timeout
      == 1) > 0
    for: 0s
    labels:
      severity: critical
  - alert: 海豚调度任务失败告警
    annotations:
      description: 调度失败任务名称：{{ $labels.process_name }}
      summary: 海豚调度任务失败告警
    expr: ds_process_failed == 1
    for: 0s
    labels:
      severity: critical
  - alert: GPU利用率持续为0
    annotations:
      description: GPU {{ $labels.gpu }} ({{ $labels.Device }}) 利用率已连续10分钟为0，可能训练任务已退出或死锁。
      summary: GPU {{ $labels.gpu }} 利用率持续为0
    expr: DCGM_FI_DEV_GPU_UTIL{job="gpu"} == 0
    for: 0s
    labels:
      severity: warning
  - alert: GPU利用率持续满载
    annotations:
      description: GPU {{ $labels.gpu }} 利用率持续超过95%达30分钟，可能存在任务阻塞或异常占用。
      summary: GPU {{ $labels.gpu }} 利用率持续满载
    expr: DCGM_FI_DEV_GPU_UTIL{job="gpu"} > 95
    for: 0s
    labels:
      severity: warning
  - alert: GPU显存使用率过高
    annotations:
      description: GPU {{ $labels.gpu }} 显存使用率 {{ $value | humanize }}%，接近满载，可能导致
        OOM。
      summary: GPU {{ $labels.gpu }} 显存使用率过高
    expr: (DCGM_FI_DEV_FB_USED{job="gpu"} / (DCGM_FI_DEV_FB_USED{job="gpu"} + DCGM_FI_DEV_FB_FREE{job="gpu"}))
      * 100 > 90
    for: 0s
    labels:
      severity: warning
  - alert: GPU温度过高
    annotations:
      description: GPU {{ $labels.gpu }} 当前温度 {{ $value }}°C，超过阈值 90°C，请检查散热。
      summary: GPU {{ $labels.gpu }} 温度过高
    expr: DCGM_FI_DEV_GPU_TEMP{job="gpu"} > 90
    for: 0s
    labels:
      severity: warning
  - alert: GPU额定功率过高
    annotations:
      description: GPU {{ $labels.gpu }} 当前功耗 {{ $value }}W，超过阈值 68W（接近额定 70W），请检查是否有异常负载。
      summary: GPU {{ $labels.gpu }} 功耗过高
    expr: DCGM_FI_DEV_POWER_USAGE{job="gpu"} > 68
    for: 0s
    labels:
      severity: warning
  - alert: GPUXID硬件故障
    annotations:
      description: GPU {{ $labels.gpu }} 检测到 XID 错误码 {{ $value }}，可能存在硬件故障。请参考 https://docs.nvidia.com/deploy/xid-errors/
        排查。
      summary: GPU {{ $labels.gpu }} 发生 XID 硬件错误
    expr: DCGM_FI_DEV_XID_ERRORS{job="gpu"} != 0
    for: 0s
    labels:
      severity: critical
  - alert: GPUECC双比特错误
    annotations:
      description: GPU {{ $labels.gpu }} 检测到 {{ $value }} 个 ECC 双比特错误 (DBE)，显存可能存在物理损坏，建议尽快更换
        GPU。
      summary: GPU {{ $labels.gpu }} 检测到 ECC 双比特错误
    expr: DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{job="gpu"} > 0
    for: 0s
    labels:
      severity: critical
  - alert: 健康检查接口服务异常
    annotations:
      description: 接口 {{ $labels.instance }} 探测失败，状态码或返回内容不符合预期
      summary: '{{ $labels.env }} 健康检查接口异常'
    expr: probe_success{job=~"health_check.*"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: 健康检查接口状态码非200
    annotations:
      description: 接口 {{ $labels.instance }} 返回状态码 {{ $value }}
      summary: '{{ $labels.env }} 健康检查状态码异常'
    expr: probe_http_status_code{job=~"health_check.*"} != 200
    for: 0s
    labels:
      severity: warning
  - alert: 健康检查接口响应超时
    annotations:
      description: 接口 {{ $labels.instance }} 响应时间 {{ $value }}s
      summary: '{{ $labels.env }} 健康检查接口响应慢'
    expr: probe_duration_seconds{job=~"health_check.*"} > 10
    for: 0s
    labels:
      severity: warning
  - alert: 服务器状态异常
    annotations:
      description: 当前节点状态异常，请及时检查主机是否存活！
      summary: 服务器 {{ $labels.instance }} 节点状态异常
    expr: up{job="node_exporter"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: 服务器CPU使用率过高
    annotations:
      description: 'CPU使用率持续超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} CPU使用率过高
    expr: (round((100 - (avg by (instance) (irate(node_cpu_seconds_total{job="node_exporter",mode="idle"}[5m]))
      * 100)) * 100) / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: 服务器内存使用率过高
    annotations:
      description: '内存使用率持续超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} 内存使用率过高
    expr: (round((100 - (node_memory_MemAvailable_bytes{job="node_exporter"} / node_memory_MemTotal_bytes{job="node_exporter"}
      * 100)) * 100) / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: 目标网关不可达
    annotations:
      description: '{{ $labels.target }} 最近 5 分钟没有一次成功探测，请在 exporter 机器上执行 ping 和
        /targets 对比。'
      summary: '{{ $labels.env }} {{ $labels.target }} 连续 ping 失败'
    expr: (((max_over_time(ping_probe_success{job="multi_ping",target!~"^10[.]88[.].*"}[5m])
      == 0) and on (env, target) (ping_target_enabled{job="multi_ping",target!~"^10[.]88[.].*"}
      == 1)) or (((max_over_time(ping_probe_success{job="multi_ping",target=~"^10[.]88[.].*"}[5m])
      == bool 0) * on (env, target) (ping_target_enabled{job="multi_ping",target=~"^10[.]88[.].*"}
      == bool 1) * (((time() + 8 * 3600) % 86400 >= bool 27000) * ((time() + 8 * 3600)
      % 86400 < bool 66600))) == 1))
    for: 0s
    labels:
      severity: warning
  - alert: ping测丢包率较高
    annotations:
      description: '{{ $labels.target }} 最近 10 分钟平均丢包率超过 50%。'
      summary: '{{ $labels.env }} {{ $labels.target }} ping 丢包率较高'
    expr: (((avg_over_time(ping_probe_packet_loss_ratio{job="multi_ping",target!~"^10[.]88[.].*"}[10m])
      > 0.5) and on (env, target) (ping_target_enabled{job="multi_ping",target!~"^10[.]88[.].*"}
      == 1)) or (((avg_over_time(ping_probe_packet_loss_ratio{job="multi_ping",target=~"^10[.]88[.].*"}[10m])
      > bool 0.5) * on (env, target) (ping_target_enabled{job="multi_ping",target=~"^10[.]88[.].*"}
      == bool 1) * (((time() + 8 * 3600) % 86400 >= bool 27000) * ((time() + 8 * 3600)
      % 86400 < bool 66600))) == 1))
    for: 0s
    labels:
      severity: warning
  - alert: ping测延迟超过200ms
    annotations:
      description: '{{ $labels.target }} 最近一次平均 ping 延迟超过 200ms，并持续至少 1 分钟。'
      summary: '{{ $labels.env }} {{ $labels.target }} ping 延迟超过 200ms'
    expr: (((ping_probe_rtt_seconds{job="multi_ping",target!~"^10[.]88[.].*"} > 0.2)
      and on (env, target) (ping_target_enabled{job="multi_ping",target!~"^10[.]88[.].*"}
      == 1)) or (((ping_probe_rtt_seconds{job="multi_ping",target=~"^10[.]88[.].*"}
      > bool 0.2) * on (env, target) (ping_target_enabled{job="multi_ping",target=~"^10[.]88[.].*"}
      == bool 1) * (((time() + 8 * 3600) % 86400 >= bool 27000) * ((time() + 8 * 3600)
      % 86400 < bool 66600))) == 1))
    for: 0s
    labels:
      severity: warning
  - alert: PingExporterProbeBacklog
    annotations:
      description: exporter 探测速度跟不上目标数量，请增加 workers、probe_interval_seconds，或拆分多个 exporter。
      summary: multi_ping_exporter 探测队列堆积
    expr: ping_exporter_queue_size{job="multi_ping"} > 0
    for: 0s
    labels:
      severity: warning
  - alert: 文件描述符使用率过高
    annotations:
      description: '当前使用率: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} 文件描述符过高
    expr: (node_filefd_allocated{job="node_exporter"} / node_filefd_maximum{job="node_exporter"})
      * 100 > 90
    for: 0s
    labels:
      severity: warning
  - alert: 网关不可达
    annotations:
      description: 网关 {{ $labels.instance }} ICMP 探测连续失败超过2分钟，可能存在丢包或网络中断
      summary: 网关 {{ $labels.instance }} 不可达
    expr: probe_success{job="xfyun_icmp_probe"} == 0
    for: 0s
    labels:
      severity: warning
  - alert: ping测延迟高
    annotations:
      description: 当前ping测延迟 {{ $value }} 秒，超过 200ms
      summary: 网关 {{ $labels.instance }} 延迟高
    expr: probe_duration_seconds{job="xfyun_icmp_probe"} > 0.2
    for: 0s
    labels:
      severity: warning
  - alert: 进程已停止
    annotations:
      description: 服务器 {{ $labels.instance }} 的进程 {{ $labels.groupname}} 已停止运行！
      summary: 进程 {{ $labels.groupname }} 已停止
    expr: namedprocess_namegroup_num_procs{groupname=~"myapp-.+"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: Web页面访问失败
    annotations:
      description: 页面无法打开，HTTP探测失败，请检查Nginx/站点
      summary: Web服务访问失败 {{ $labels.instance }}
    expr: probe_success{job=~"web_.+|.+_http|_.+"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: Web响应缓慢
    annotations:
      description: 响应时间 {{ $value }}s，超过10秒
      summary: Web响应过慢 {{ $labels.instance }}
    expr: probe_duration_seconds{job=~"web_.+|.+_http|_.+"} > 10
    for: 0s
    labels:
      severity: warning
  - alert: 站点HTTP状态码异常
    annotations:
      description: 站点状态码非200，当前状态码为 {{ $value }}
      summary: Web服务状态码非200，站点实例：{{ $labels.instance }}
    expr: probe_http_status_code != 200
    for: 0s
    labels:
      severity: critical
  - alert: 数仓 PostgreSQL 服务宕机
    annotations:
      description: ''
      summary: PostgreSQL 服务不可用
    expr: up{instance="192.0.2.155:9187",job="postgres"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: 交叉楼服务器状态异常
    annotations:
      description: 当前节点状态异常，请及时检查主机是否存活！
      summary: 服务器 {{ $labels.instance }} 节点状态异常
    expr: up{job="jcl_node_exporter"} == 0
    for: 0s
    labels:
      severity: critical
  - alert: 交叉楼服务器CPU使用率过高
    annotations:
      description: 'CPU使用率持续超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} CPU使用率过高
    expr: (round((100 - (avg by (instance) (irate(node_cpu_seconds_total{job="jcl_node_exporter",mode="idle"}[5m]))
      * 100)) * 100) / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: 交叉楼服务器内存使用率过高
    annotations:
      description: '内存使用率持续超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} 内存使用率过高
    expr: (round((100 - (node_memory_MemAvailable_bytes{job="jcl_node_exporter"} /
      node_memory_MemTotal_bytes{job="jcl_node_exporter"} * 100)) * 100) / 100) >
      90
    for: 0s
    labels:
      severity: critical
  - alert: 交叉楼服务器系统盘磁盘使用率过高
    annotations:
      description: '分区 {{ $labels.mountpoint }} 使用率超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} 系统磁盘空间使用率过高
    expr: (round((100 - (node_filesystem_avail_bytes{job="jcl_node_exporter",mountpoint="/"}
      / node_filesystem_size_bytes{job="jcl_node_exporter",mountpoint="/"} * 100))
      * 100) / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: 交叉楼服务器数据磁盘使用率过高
    annotations:
      description: '分区 {{ $labels.mountpoint }} 使用率超过90%，当前值: {{ $value }}%'
      summary: 服务器 {{ $labels.instance }} 数据磁盘空间使用率过高
    expr: (round((100 - (node_filesystem_avail_bytes{job="jcl_node_exporter",mountpoint="/mnt/7974da9b-2208-429d-80dd-2c343a74f767"}
      / node_filesystem_size_bytes{job="jcl_node_exporter",mountpoint="/mnt/7974da9b-2208-429d-80dd-2c343a74f767"}
      * 100)) * 100) / 100) > 90
    for: 0s
    labels:
      severity: critical
  - alert: 数仓磁盘使用率过高
    annotations:
      description: '分区使用率超过85%，当前值: {{ $value }}%'
      summary: 数仓服务器 {{ $labels.instance }} 磁盘空间使用率过高
    expr: (round((100 - (node_filesystem_avail_bytes{instance="192.0.2.155:9100",mountpoint="/data"}
      / node_filesystem_size_bytes{instance="192.0.2.155:9100",mountpoint="/data"}
      * 100)) * 100) / 100) > 85
    for: 0s
    labels:
      severity: critical
