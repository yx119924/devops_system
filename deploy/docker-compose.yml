version: "3"
services:
  dvadmin3-web:
    container_name: dvadmin3-web
    # ===== 已改造：build 改为 image，配合 docker save/load 直接启动 =====
    image: devops-platform-dvadmin3-web:latest
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./docker_env/nginx/my.conf:/etc/nginx/conf.d/my.conf
      - ./backend/media:/backend/media
    expose:
      - "8080"
    restart: always
    networks:
      network:
        ipv4_address: 172.30.0.11

  dvadmin3-django:
    # ===== 已改造：build 改为 image =====
    image: devops-platform-dvadmin3-django:latest
    container_name: dvadmin3-django
    working_dir: /backend
    depends_on:
      - dvadmin3-mysql
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_HOST: dvadmin3-mysql
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    ports:
      - "8000:8000"
    expose:
      - "8000"
    restart: always
    networks:
      network:
        ipv4_address: 172.30.0.12

  dvadmin3-mysql:
    image: mysql:8.0
    container_name: dvadmin3-mysql
    privileged: true
    restart: always
    ports:
      # ===== 已改造：127.0.0.1:3306 -> 3306（0.0.0.0，供内网其他机器直连）
      # 若无需外部直连数据库，可改回 "127.0.0.1:3306:3306" 更安全
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: "django-vue3-admin"
      TZ: Asia/Shanghai
    command:
      --wait_timeout=31536000
      --interactive_timeout=31536000
      --max_connections=1000
      --default-authentication-plugin=mysql_native_password
    volumes:
      - "./docker_env/mysql/data:/var/lib/mysql"
      - "./docker_env/mysql/conf.d:/etc/mysql/conf.d"
      - "./docker_env/mysql/logs:/logs"
    networks:
      network:
        ipv4_address: 172.30.0.13


  dvadmin3-celery:
    # ===== 已改造：build 改为 image =====
    image: devops-platform-dvadmin3-celery:latest
    container_name: dvadmin3-celery
    working_dir: /backend
    depends_on:
      - dvadmin3-mysql
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_HOST: dvadmin3-mysql
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    restart: always
    networks:
      network:
        ipv4_address: 172.30.0.14


  dvadmin3-redis:
    image: redis:6.2.6-alpine
    container_name: dvadmin3-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./docker_env/redis/data:/data
      - ./docker_env/redis/redis.conf:/etc/redis/redis.conf
    ports:
      # ===== 已改造：127.0.0.1:6379 -> 6379（0.0.0.0，供内网其他机器直连）
      # 若无需外部直连缓存，可改回 "127.0.0.1:6379:6379" 更安全
      - "6379:6379"
    sysctls:
      - net.core.somaxconn=1024
    command: /bin/sh -c "echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf && redis-server /etc/redis/redis.conf --appendonly yes --requirepass ${REDIS_PASSWORD}"
    privileged: true
    networks:
      network:
        ipv4_address: 172.30.0.15


networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '172.30.0.0/16'
